    * {

      box-sizing: border-box;

    }

    body {
      background-color: #f2f2f2;
    }

    .navbar {
      background: linear-gradient(135deg, #0f1724 0%, #071029 100%);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 40px;
      /* 15px top/bottom 40px right/left */
      box-shadow: 0 8px 22px rgba(29, 78, 169, 0.25);
    }

    .text-web {
      color: #bcd8ff;
      font-size: 24px;
      font-weight: bold;
    }

    .nav-links {
      list-style: none;
      display: flex;
    }

    .nav-links li {
      margin-left: 25px;
    }

    .nav-links a {
      text-decoration: none;
      color: #ffffff;
      font-size: 18px;
      transition: 0.3s;
      font-weight: bold;
    }

    .nav-links a:hover {
      color: burlywood;
    }

    .btn {
      padding: 5px 15px;
      border-radius: 5px;
      background-color: whitesmoke;
      text-decoration: none;
    }

    .T-shirt img {
      width: 350px;
      height: auto;
    }

    .title {
      text-align: center;
      font-size: 25px;
      font-weight: bold;
      color: black;
    }

    .container {
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    .cover {
      filter: brightness(50%);
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    .footer {
      background-color: burlywood;
      color: #000;
      padding: 40px 60px;

    }

    .footer-container {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    .footer-logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .footer-logo img {
      width: 40px;
      height: 40px;
    }

    .footer-logo h2 {
      font-size: 20px;
      font-weight: bold;
    }

    .footer-section {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .footer-section h3 {
      font-weight: bold;
      margin-bottom: 10px;
    }

    .footer-section a {
      text-decoration: none;
      color: #000;
      transition: 0.3s;
    }

    .footer-section a:hover {
      color: #333;
      text-decoration: underline;
    }

    .contact p {
      margin: 5px 0;
    }
  </style>
